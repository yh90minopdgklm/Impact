<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impact Chat Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <style>
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* Markdown 스타일링 */
    .markdown-content {
      word-wrap: break-word;
    }
    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      font-weight: bold;
      margin-top: 1em;
      margin-bottom: 0.5em;
    }
    .markdown-content h1 { font-size: 1.5em; }
    .markdown-content h2 { font-size: 1.3em; }
    .markdown-content h3 { font-size: 1.1em; }
    .markdown-content p {
      margin: 0.5em 0;
    }
    .markdown-content p:first-child {
      margin-top: 0;
    }
    .markdown-content p:last-child {
      margin-bottom: 0;
    }
    .markdown-content ul,
    .markdown-content ol {
      margin: 0.5em 0;
      padding-left: 1.5em;
    }
    .markdown-content li {
      margin: 0.25em 0;
    }
    .markdown-content code {
      background-color: rgba(0, 0, 0, 0.1);
      padding: 0.2em 0.4em;
      border-radius: 0.25em;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }
    .markdown-content pre {
      background-color: rgba(0, 0, 0, 0.1);
      padding: 0.75em;
      border-radius: 0.5em;
      overflow-x: auto;
      margin: 0.5em 0;
    }
    .markdown-content pre code {
      background-color: transparent;
      padding: 0;
    }
    .markdown-content blockquote {
      border-left: 3px solid rgba(0, 0, 0, 0.2);
      padding-left: 1em;
      margin: 0.5em 0;
      font-style: italic;
    }
    .markdown-content a {
      text-decoration: underline;
      opacity: 0.9;
    }
    .markdown-content a:hover {
      opacity: 1;
    }
    .markdown-content table {
      border-collapse: collapse;
      margin: 0.5em 0;
      width: 100%;
    }
    .markdown-content th,
    .markdown-content td {
      border: 1px solid rgba(0, 0, 0, 0.2);
      padding: 0.5em;
    }
    .markdown-content th {
      background-color: rgba(0, 0, 0, 0.05);
      font-weight: bold;
    }
    /* 사용자 메시지의 마크다운 스타일 (흰색 텍스트용) */
    .markdown-content.user-msg h1,
    .markdown-content.user-msg h2,
    .markdown-content.user-msg h3,
    .markdown-content.user-msg h4,
    .markdown-content.user-msg h5,
    .markdown-content.user-msg h6 {
      color: white;
    }
    .markdown-content.user-msg code {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
    }
    .markdown-content.user-msg pre {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
    }
    .markdown-content.user-msg blockquote {
      border-left-color: rgba(255, 255, 255, 0.4);
    }
    .markdown-content.user-msg a {
      color: rgba(255, 255, 255, 0.9);
    }
    .markdown-content.user-msg th,
    .markdown-content.user-msg td {
      border-color: rgba(255, 255, 255, 0.3);
    }
    .markdown-content.user-msg th {
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="flex h-screen w-full bg-white text-gray-900 font-sans overflow-hidden">
    
    <!-- 1️⃣ 왼쪽 사이드바: 채팅방 목록 -->
    <div id="left-sidebar" class="w-[280px] bg-[#F7F7F8] border-r border-[#E5E5E5] flex flex-col flex-shrink-0">
      <!-- 동적으로 렌더링됨 -->
    </div>

    <!-- 2️⃣ 중앙: 채팅 메시지 영역 -->
    <div class="flex-1 flex flex-col h-full relative min-w-0">
      <!-- 헤더 -->
      <header id="main-header" class="h-14 border-b border-[#E5E5E5] flex items-center justify-between px-6 bg-white z-10">
        <!-- 동적으로 렌더링됨 -->
      </header>

      <!-- 메시지 리스트 -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-6 bg-white">
        <!-- 동적으로 렌더링됨 -->
      </div>

      <!-- 입력창 -->
      <div id="input-container" class="p-4 bg-white">
        <!-- 동적으로 렌더링됨 -->
      </div>
    </div>

    <!-- 3️⃣ 우측 사이드바: 분기 목록 -->
    <div id="right-sidebar" class="border-l border-[#E5E5E5] bg-[#F9FAFB] flex flex-col transition-all duration-300 ease-in-out w-0 translate-x-full border-none">
      <!-- 동적으로 렌더링됨 -->
    </div>

    <!-- 분기 생성 모달 -->
    <div id="modal-container">
      <!-- 동적으로 렌더링됨 -->
    </div>

  </div>

  <script type="module" src="srcs/app.js"></script>
</body>
</html>
